<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thraveen ❤️ Kamali | Our Love Story</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 0%,#4b1938 0%,#170b18 45%,#050307 100%);
    font-family:Georgia,"Times New Roman",serif;
    color:white;
}

/* =========================
   FLOATING HEARTS
========================= */

.heart{
    position:fixed;
    bottom:-40px;
    z-index:1;
    pointer-events:none;
    animation:heartFloat linear forwards;
    opacity:0;
}

@keyframes heartFloat{

    0%{
        transform:translateY(0) scale(.6) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(-110vh)
            translateX(50px)
            scale(1.3)
            rotate(25deg);
        opacity:0;
    }
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:15px;

    position:relative;
    z-index:2;
}

/* =========================
   BOOK
========================= */

.book{
    width:min(90vw,420px);
    height:min(70vh,590px);

    position:relative;

    perspective:2000px;
}

/* =========================
   PAGE
========================= */

.page{
    position:absolute;

    width:100%;
    height:100%;

    top:0;
    left:0;

    padding:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    border-radius:6px 16px 16px 6px;

    background:
        linear-gradient(
            135deg,
            #fffdfd,
            #ffe8f0
        );

    color:#351622;

    box-shadow:
        0 20px 50px rgba(0,0,0,.55),
        inset 5px 0 12px rgba(80,20,40,.08);

    transform-origin:left center;

    transform-style:preserve-3d;

    transition:
        transform 1s cubic-bezier(.77,0,.18,1);

    backface-visibility:hidden;

    overflow:hidden;

    cursor:pointer;
}

.page.flipped{
    transform:rotateY(-180deg);
}

/* Page content */

.page-content{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;
}

/* =========================
   COVER
========================= */

.cover{
    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,.18),
            transparent 25%
        ),
        linear-gradient(
            145deg,
            #781d45,
            #2c0d23 65%,
            #080309
        );

    color:white;
}

.cover h1{
    color:white;
    font-size:38px;
    margin-bottom:18px;
}

.cover p{
    color:#ffdce9;
}

/* =========================
   TEXT
========================= */

.chapter{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;

    color:#b34e72;

    margin-bottom:15px;
}

h2{
    color:#8e3155;
    font-size:27px;

    margin-bottom:18px;
}

p{
    color:#4c2938;

    font-size:16px;
    line-height:1.8;
}

.big-heart{
    font-size:70px;

    margin-bottom:18px;

    animation:pulse 1.8s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.13);
    }
}

/* =========================
   PHOTO
========================= */

.story-photo{
    width:86%;
    max-height:52%;

    object-fit:cover;

    border-radius:13px;

    margin-bottom:18px;

    box-shadow:
        0 12px 30px rgba(50,10,30,.35);
}

.photo-caption{
    font-size:15px;
    line-height:1.65;
}

/* =========================
   PAGE NUMBER
========================= */

.page-number{
    position:absolute;

    right:17px;
    bottom:12px;

    color:#9b6879;

    font-size:11px;
}

/* =========================
   FINAL
========================= */

.final-message{
    color:#8e3155;

    font-size:25px;

    line-height:1.7;
}

.signature{
    color:#a34e6e;

    font-size:16px;

    line-height:1.7;

    margin-top:20px;
}

/* =========================
   BUTTONS
========================= */

.controls{
    display:flex;

    gap:14px;

    margin-top:18px;

    z-index:10;
}

button{
    border:0;

    padding:12px 23px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #e45b88,
            #8e3155
        );

    color:white;

    font-size:14px;

    font-weight:bold;

    box-shadow:
        0 8px 20px rgba(0,0,0,.35);

    cursor:pointer;
}

button:active{
    transform:scale(.94);
}

/* =========================
   MUSIC BUTTON
========================= */

.music-btn{
    position:fixed;

    top:17px;
    right:17px;

    width:46px;
    height:46px;

    padding:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;

    z-index:50;
}

/* =========================
   COUNTER
========================= */

.counter{
    margin-top:9px;

    color:#e9b6c8;

    font-size:12px;
}

   TAP H
